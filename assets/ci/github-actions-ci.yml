# schematize-node — workflow de CI de referência (§13, §21, a `schematize-qa`, §35).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack.
name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with: { fetch-depth: 0 }
      - name: Gate de padrões (DoD/§37) no diff
        run: bash .claude/skills/schematize-node/scripts/check-diff.sh "origin/${{ github.base_ref || 'main' }}"
      - name: Índice de microfunções atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './src' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-node/scripts/check-index.sh
      - name: Scan de segredo no archive (§16.1/§32)
        run: bash .claude/skills/schematize-node/scripts/archive-secret-scan.sh .

  node-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version-file: .nvmrc, cache: npm }   # versão do runtime pinada no repo (LTS suportada)
      - name: npm ci (lockfile respeitado, sem lifecycle scripts de dependência)
        run: npm ci --ignore-scripts
      - name: tsc --noEmit (strict no código novo/tocado — assets/lint/tsconfig.strict.json)
        run: npx tsc --noEmit
      - name: ESLint (flat config — assets/lint/eslint.config.mjs)
        run: npx eslint . --max-warnings 0
      - name: Testes
        run: npm test --if-present
      - name: npm audit (CVE de dependência de produção; allowlist time-boxed no ADR)
        run: npm audit --omit=dev --audit-level=high
      - name: Higiene de deps e EOL do runtime (scripts/node-audit.mjs)
        run: node .claude/skills/schematize-node/scripts/node-audit.mjs --max-direct 40

  test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Smoke + security + authz + hardening (PR — a `schematize-qa` (gates de CI, `references/execucao.md` secao 6))
        run: |
          # <projeto> test smoke && <projeto> test security && <projeto> test authz && <projeto> test hardening
          echo "ligue ao CLI <projeto>_ops aqui"
      - name: Smoke self-check (anti verde-mentiroso — a `schematize-qa` (smoke e matriz simulated, `references/categorias.md` secoes 5 e 10))
        run: bash .claude/skills/schematize-node/scripts/smoke-selfcheck.sh --self-check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: '1' }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
